<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontakt – Genetia</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/pages/kontakt/kontakt.css" />
  </head>
  <body>
     <header class="site-header">
      <!-- NAVIGACE -->
      <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
        <div class="container align-items-center justify-content-between">
          <!-- Logo -->
          <a
            class="navbar-brand d-flex align-items-center gap-2"
            href="index.html"
          >
            <img
              src="assets/images/logo/GENETIA-LOGO.png"
              alt="Genetia logo"
              class="logo-img"
            />
          </a>

          <!-- Desktop navigace (centrálně) -->
          <div class="d-none d-lg-flex mx-auto nav-center">
            <ul class="navbar-nav text-center gap-4"></ul>
          </div>

          <!-- Klientská zóna -->
          <button class="btn btn-accent" id="openClientModal">
            Klientská zóna
          </button>

       <!-- Mobile hamburger + rychlé menu -->
        <label class="hamburger-wrapper d-lg-none">
          <input type="checkbox" id="menu-toggle" />
          <span class="menu">
            <span class="hamburger"></span>
          </span>
          <ul class="mobile-nav">
            <li><a href="index.html">Domů</a></li>
            <li><a href="o-spolecnosti.html">O společnosti</a></li>
            <li><a href="produkty.html">Produkty</a></li>
            <li><a href="vyvoj-vyzkum.html">Vývoj a výzkum</a></li>
            <li><a href="analyticke-sluzby.html">Analytické služby</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
          </ul>
        </label>
        </div>

        <!-- Mobile menu (collapse) -->
        <div class="collapse navbar-collapse" id="navMobile">
          <ul class="navbar-nav text-center gap-3 py-3"></ul>
        </div>
      </nav>
    </header>

    <!-- ================================
     MODAL – KLIENTSKÁ ZÓNA
    =================================== -->
    <div id="clientModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Přihlášení do klientské zóny</h2>
        <form id="clientForm">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />

          <label for="password">Heslo:</label>
          <input type="password" id="password" name="password" required />

          <label for="certUpload">Nahrát certifikát:</label>
          <input
            type="file"
            id="certUpload"
            name="certUpload"
            accept=".crt,.pem,.pfx"
          />

          <button type="submit" class="btn btn-accent w-100 mt-3">
            Ověřit přístup
          </button>
        </form>
      </div>
    </div>
   
    <section class="form-contact" id="form-contact">
      <div class="container">
        <div class="row justify-content-center">
          <!-- Pravý blok: formulář (AJAX-ready) -->
          <div class="col-lg-7">
            <form
              id="contactForm"
              class="contact-form card-base p-4 shadow-sm"
              method="POST"
              data-endpoint="https://formspree.io/f/mdkyngvb"
            >
              <!-- Honeypot (antispam) -->
              <input
                type="text"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off"
                style="position: absolute; left: -9999px"
                aria-hidden="true"
              />

              <div class="row g-3">
                <!-- Jméno -->
                <div class="col-md-6">
                  <input
                    type="text"
                    class="form-control"
                    name="name"
                    placeholder="Jméno a příjmení"
                    autocomplete="name"
                    required
                  />
                </div>

                <!-- E-mail -->
                <div class="col-md-6">
                  <input
                    type="email"
                    class="form-control"
                    name="_replyto"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                  />
                </div>

                <!-- Předmět -->
                <div class="col-12">
                  <input
                    type="text"
                    class="form-control"
                    name="subject"
                    placeholder="Předmět zprávy (volitelné)"
                    autocomplete="off"
                  />
                </div>

                <!-- Zpráva -->
                <div class="col-12">
                  <textarea
                    class="form-control"
                    name="message"
                    rows="5"
                    placeholder="Vaše zpráva..."
                    required
                  ></textarea>
                </div>

                <!-- reCAPTCHA tlačítko -->
                <div class="col-12 text-end">
                  <button class="btn btn-accent px-4 py-2" type="submit">
                    Odeslat zprávu
                  </button>
                </div>

                <!-- Inline fallback místo modalu -->
                <div class="col-12">
                  <div
                    id="formInlineMessage"
                    class="form-inline-message"
                    hidden
                  ></div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <small>© <span id="year"></span> Genetia s.r.r.o.</small>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
